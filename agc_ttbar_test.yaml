workflow:
  name: "cms_open_data_ttbar_two_schedulers_iterative"

  artifacts:
    fileset:    { uri: "fileset.json",           type: "json" }
    manifest:   { uri: "manifest.json",          type: "json" }
    partial_a:  { uri: "partials/part_A.pkl",    type: "pickle" }
    partial_b:  { uri: "partials/part_B.pkl",    type: "pickle" }
    merged:     { uri: "merged.pkl",             type: "pickle" }
    validation_report: { uri: "validation.json",        type: "json"}
    plot_dir:   { uri: "plots"}
    plot_index: { uri: "plots/index.md",         type: "md"}

  steps:
    # step A: dataset_creation
    datasets:
      kind: dataset_creation
      outputs: [fileset]
      params:
        fileset_factory: "agc_ttbar.wrappers:make_fileset"
        fileset_kwargs:
          n_files_max_per_sample: 5    
          use_xcache: false
          af_name: ""
          input_from_eos: false      
          xcache_atlas_prefix: "" 
          
    # split into two partitions
    partition:
      kind: partition_fileset
      depends_on: [datasets]
      inputs: [fileset]
      outputs: [manifest]
      params:
        strategy: "split_half"
        partition_ids: ["A", "B"]

    # skip processor and use merged.pkl from previous run
    merge:
      kind: merge_outputs
      depends_on: [partition]
      inputs: [partial_a, partial_b]
      outputs: [merged]
      params:
        merge_strategy: "coffea_accumulator"

    validate:
      kind: validate_histograms
      depends_on: [merge]
      inputs: [merged]
      outputs: [validation_report]
      params:
          require_nonempty: true
          required_hist_keys: ["4j1b"]
          
    plots:
      kind: plot_histograms
      depends_on: [validate]
      inputs: [merged]
      outputs: [plot_dir, plot_index]
      plot_factory: "agc_ttbar.wrappers:make_plots"
      use_inference: false
